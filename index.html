<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<title>MYFLASH</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=30">
<link rel="stylesheet" href="css/themes.css?v=30">
<link rel="stylesheet" href="css/animations.css?v=30">
</head>
<body>

<div id="app">

  <!-- ───────────────────────── HOME ───────────────────────── -->
  <section class="screen is-active" id="screen-home">
    <div class="home-wrap">
      <button class="icon-btn corner-btn" id="btn-settings" aria-label="Settings">&#9881;</button>
      <h1 class="wordmark">
        <span class="wordmark-a">my</span><span class="wordmark-b">flash</span>
      </h1>
      <p class="tagline">Family medicine board prep</p>

      <div class="deck-list" id="deck-list"></div>

      <div class="home-actions">
        <button class="btn btn-ghost" id="btn-new-deck">+ New deck</button>
      </div>
    </div>
  </section>

  <!-- ─────────────────────── SETTINGS ─────────────────────── -->
  <section class="screen" id="screen-settings">
    <div class="settings-wrap">
      <div class="screen-head">
        <button class="icon-btn" id="btn-settings-back" aria-label="Back">&#8592;</button>
        <h2 class="screen-title">Settings</h2>
      </div>

      <h3 class="settings-head">Answering</h3>
      <div class="settings-group">
        <button class="toggle" id="tg-submit" role="switch" aria-checked="false">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">
            <span class="toggle-name">Submit on release</span>
            <span class="toggle-note">Number cards answer when you let go, instead of waiting for CHECK.</span>
          </span>
        </button>
      </div>

      <h3 class="settings-head">Feedback</h3>
      <div class="settings-group">
        <button class="toggle" id="tg-sound" role="switch" aria-checked="false">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">
            <span class="toggle-name">Sound</span>
            <span class="toggle-note">Short blips on answers and on streaks.</span>
          </span>
        </button>
        <button class="toggle" id="tg-haptics" role="switch" aria-checked="false">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">
            <span class="toggle-name">Vibration</span>
            <span class="toggle-note" id="haptics-note">A tick when a swipe has gone far enough to take.</span>
          </span>
        </button>
      </div>

      <!-- Destructive, so it lives here rather than a tap away from
           starting a session on the home screen. -->
      <h3 class="settings-head">Your decks</h3>
      <div class="settings-group" id="deck-manager"></div>

      <h3 class="settings-head" hidden>Looks you marked</h3>
      <div class="settings-group" id="look-feedback" hidden></div>

      <h3 class="settings-head">App</h3>
      <div class="settings-group">
        <p class="settings-empty" id="app-build">Version —</p>
        <button class="btn btn-ghost" id="btn-update">Check for update</button>
        <p class="settings-empty">Reloads everything from the network. Your decks and
          progress are stored separately and are kept.</p>
      </div>

      <h3 class="settings-head">Data</h3>
      <div class="settings-group">
        <button class="btn btn-ghost" id="btn-reset-progress">Reset progress</button>
      </div>
    </div>
  </section>

  <!-- ──────────────────────── SESSION ─────────────────────── -->
  <section class="screen" id="screen-session">
    <div class="hud">
      <button class="hud-btn" id="btn-quit" aria-label="End session">&#10005;</button>
      <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
      <!-- Judge the look while you are looking at it. A verdict cast in a
           tool is an assessment; one cast mid-session is a reaction. -->
      <button class="hud-btn hud-nope" id="btn-nope" hidden
              aria-label="Mark this colour combination as bad" aria-pressed="false">&#128078;</button>
      <div class="streak" id="streak"><span id="streak-n">0</span>&#128293;</div>
    </div>
    <div id="stage" class="stage"></div>
  </section>

  <!-- ──────────────────────── SUMMARY ─────────────────────── -->
  <section class="screen" id="screen-summary">
    <div class="summary-wrap">
      <h2 class="summary-title" id="summary-title">DONE</h2>
      <div class="summary-stats" id="summary-stats"></div>
      <div class="home-actions">
        <button class="btn btn-solid" id="btn-again">Run it back</button>
        <button class="btn btn-ghost" id="btn-home">Home</button>
      </div>
    </div>
  </section>

  <!-- ──────────────────────── EDITOR ──────────────────────── -->
  <section class="screen" id="screen-editor">
    <div class="editor-wrap">
      <h2 class="editor-title">NEW DECK</h2>
      <label class="field">
        <span>Deck name</span>
        <input type="text" id="deck-name" placeholder="Guitar chords">
      </label>
      <label class="field">
        <span>Cards &mdash; one per line, <code>front | back</code></span>
        <textarea id="deck-body" rows="12" placeholder="C major | C E G&#10;A minor | A C E"></textarea>
      </label>
      <div class="home-actions">
        <button class="btn btn-solid" id="btn-save-deck">Save deck</button>
        <button class="btn btn-ghost" id="btn-cancel-deck">Cancel</button>
      </div>
    </div>
  </section>

</div>

<script src="js/theme.js?v=30"></script>
<script src="js/audio.js?v=30"></script>
<script src="js/decks.js?v=30"></script>
<script src="js/store.js?v=30"></script>
<script src="js/text.js?v=30"></script>
<script src="js/modes.js?v=30"></script>
<script src="js/app.js?v=30"></script>
</body>
</html>
