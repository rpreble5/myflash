<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<title>MYFLASH</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=82">
<link rel="stylesheet" href="css/themes.css?v=82">
<link rel="stylesheet" href="css/animations.css?v=82">
</head>
<body>

<div id="app">

  <!-- ───────────────────────── HOME ───────────────────────── -->
  <section class="screen is-active" id="screen-home">
    <div class="home-wrap">
      <button class="icon-btn corner-btn" id="btn-settings" aria-label="Settings">&#9881;</button>
      <h1 class="wordmark">
        <span class="wordmark-a">my</span><span class="wordmark-b">flash</span>
      </h1>
      <!-- Which subject the list below shows; tapping it opens the list
           of subjects to switch between. -->
      <button class="subject-switch" id="btn-subject" aria-haspopup="true">
        <span id="subject-name">Family Medicine</span><span class="subject-caret" aria-hidden="true">▾</span>
      </button>

      <!-- The Challenge: ten topics on a path, each beaten on a run of
           limited hearts. -->
      <button class="challenge-entry" id="btn-challenge">
        <span class="challenge-entry-name">CHALLENGE</span>
        <span class="challenge-entry-line" id="challenge-line"></span>
      </button>

      <div class="deck-list" id="deck-list"></div>
    </div>
  </section>

  <!-- ─────────────────────── CHALLENGE ────────────────────── -->
  <section class="screen" id="screen-challenge">
    <div class="path-wrap">
      <div class="screen-head">
        <button class="icon-btn" id="btn-challenge-back" aria-label="Back">&#8592;</button>
        <h2 class="screen-title">Challenge</h2>
      </div>
      <p class="path-intro" id="path-intro"></p>
      <div class="path" id="path"></div>
    </div>
  </section>

  <!-- ─────────────────────── SETTINGS ─────────────────────── -->
  <section class="screen" id="screen-settings">
    <div class="settings-wrap">
      <div class="screen-head">
        <button class="icon-btn" id="btn-settings-back" aria-label="Back">&#8592;</button>
        <h2 class="screen-title">Settings</h2>
      </div>

      <h3 class="settings-head">Answering</h3>
      <div class="settings-group">
        <button class="toggle" id="tg-slider" role="switch" aria-checked="false">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">
            <span class="toggle-name">Slider for number cards</span>
            <span class="toggle-note">Drag up or down to set the number instead of typing it on the keypad.</span>
          </span>
        </button>
        <button class="toggle" id="tg-submit" role="switch" aria-checked="false">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">
            <span class="toggle-name">Submit on release</span>
            <span class="toggle-note">With the slider, number cards answer when you let go, instead of waiting for CHECK.</span>
          </span>
        </button>
      </div>

      <h3 class="settings-head">Feedback</h3>
      <div class="settings-group">
        <button class="toggle" id="tg-sound" role="switch" aria-checked="false">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">
            <span class="toggle-name">Sound</span>
            <span class="toggle-note">Short blips on answers and on streaks.</span>
          </span>
        </button>
        <button class="toggle" id="tg-haptics" role="switch" aria-checked="false">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text">
            <span class="toggle-name">Vibration</span>
            <span class="toggle-note" id="haptics-note">A tick when a swipe has gone far enough to take.</span>
          </span>
        </button>
      </div>

      <!-- Destructive, so it lives here rather than a tap away from
           starting a session on the home screen. -->
      <h3 class="settings-head">Your decks</h3>
      <div class="settings-group" id="deck-manager"></div>

      <h3 class="settings-head">App</h3>
      <div class="settings-group">
        <p class="settings-empty" id="app-build">Version —</p>
        <p class="settings-empty" id="screen-info"></p>
        <button class="btn btn-ghost" id="btn-update">Check for update</button>
        <p class="settings-empty">Reloads everything from the network. Your decks and
          progress are stored separately and are kept.</p>
      </div>

      <h3 class="settings-head">Data</h3>
      <div class="settings-group">
        <button class="btn btn-ghost" id="btn-reset-progress">Reset progress</button>
      </div>
    </div>
  </section>

  <!-- ──────────────────────── SESSION ─────────────────────── -->
  <section class="screen" id="screen-session">
    <div class="hud">
      <button class="hud-btn" id="btn-quit" aria-label="End session">&#10005;</button>
      <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="streak" id="streak"><span id="streak-n">0</span>&#128293;</div>
      <img class="hud-baddie" id="hud-baddie" alt="" hidden>
      <div class="hearts" id="hearts" hidden></div>
    </div>
    <div id="stage" class="stage"></div>
  </section>

  <!-- ──────────────────────── SUMMARY ─────────────────────── -->
  <section class="screen" id="screen-summary">
    <div class="summary-wrap">
      <img class="summary-baddie" id="summary-baddie" alt="" hidden>
      <h2 class="summary-title" id="summary-title">DONE</h2>
      <div class="summary-stats" id="summary-stats"></div>
      <div class="home-actions">
        <button class="btn btn-solid" id="btn-again">Run it back</button>
        <button class="btn btn-ghost" id="btn-home">Home</button>
      </div>
    </div>
  </section>

</div>

<script src="js/audio.js?v=82"></script>
<script src="js/decks.js?v=82"></script>
<script src="js/challenge.js?v=82"></script>
<script src="js/store.js?v=82"></script>
<script src="js/text.js?v=82"></script>
<script src="js/modes.js?v=82"></script>
<script src="js/app.js?v=82"></script>
</body>
</html>
