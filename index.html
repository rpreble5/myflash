<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<title>MYFLASH</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Bungee&family=Monoton&family=Outfit:wght@900&family=Passion+One:wght@900&family=Righteous&family=Rubik+Mono+One&family=Shrikhand&family=Sora:wght@800&family=Space+Grotesk:wght@700&family=Syne:wght@800&family=Titan+One&family=Unbounded:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div id="app">

  <!-- ───────────────────────── HOME ───────────────────────── -->
  <section class="screen is-active" id="screen-home">
    <div class="home-wrap">
      <h1 class="wordmark">
        <span class="wordmark-a">MY</span><span class="wordmark-b">FLASH</span>
      </h1>
      <p class="tagline">Loud cards. Weird questions. No two the same.</p>

      <div class="deck-list" id="deck-list"></div>

      <div class="home-actions">
        <button class="btn btn-ghost" id="btn-new-deck">+ New deck</button>
        <button class="btn btn-ghost" id="btn-reset-progress">Reset progress</button>
      </div>
    </div>
  </section>

  <!-- ──────────────────────── SESSION ─────────────────────── -->
  <section class="screen" id="screen-session">
    <div class="hud">
      <button class="hud-btn" id="btn-quit" aria-label="End session">&#10005;</button>
      <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="streak" id="streak"><span id="streak-n">0</span>&#128293;</div>
    </div>
    <div id="stage" class="stage"></div>
  </section>

  <!-- ──────────────────────── SUMMARY ─────────────────────── -->
  <section class="screen" id="screen-summary">
    <div class="summary-wrap">
      <h2 class="summary-title" id="summary-title">DONE</h2>
      <div class="summary-stats" id="summary-stats"></div>
      <div class="home-actions">
        <button class="btn btn-solid" id="btn-again">Run it back</button>
        <button class="btn btn-ghost" id="btn-home">Home</button>
      </div>
    </div>
  </section>

  <!-- ──────────────────────── EDITOR ──────────────────────── -->
  <section class="screen" id="screen-editor">
    <div class="editor-wrap">
      <h2 class="editor-title">NEW DECK</h2>
      <label class="field">
        <span>Deck name</span>
        <input type="text" id="deck-name" placeholder="Guitar chords">
      </label>
      <label class="field">
        <span>Cards &mdash; one per line, <code>front | back</code></span>
        <textarea id="deck-body" rows="12" placeholder="C major | C E G&#10;A minor | A C E"></textarea>
      </label>
      <div class="home-actions">
        <button class="btn btn-solid" id="btn-save-deck">Save deck</button>
        <button class="btn btn-ghost" id="btn-cancel-deck">Cancel</button>
      </div>
    </div>
  </section>

</div>

<script src="js/theme.js"></script>
<script src="js/audio.js"></script>
<script src="js/decks.js"></script>
<script src="js/store.js"></script>
<script src="js/text.js"></script>
<script src="js/modes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
