<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MYFLASH — deck check</title>

<!-- A utility, not a card. No theme engine, no display fonts: this page
     has to be legible at 3am on a phone, not beautiful. -->
<style>
  :root {
    --ink: #14110E;
    --paper: #F4F1EA;
    --dim: #6B635A;
    --line: #DAD4C8;
    --err: #B02A15;
    --warn: #9A6B00;
    --ok: #1F6B3A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 0 0 4rem;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--ink); color: var(--paper);
    padding: .7rem .9rem calc(.7rem + env(safe-area-inset-top));
    padding-top: calc(.7rem + env(safe-area-inset-top));
  }
  h1 { margin: 0 0 .5rem; font-size: 1rem; letter-spacing: .12em; font-weight: 700; }
  h1 small { opacity: .5; font-weight: 400; letter-spacing: .04em; }
  .tabs { display: flex; gap: .4rem; }
  .tabs button {
    flex: 1; padding: .55rem; border: 0; border-radius: 3px;
    background: rgba(244,241,234,.14); color: var(--paper);
    font: inherit; font-size: .8rem; letter-spacing: .1em; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); }

  /* The same control one level down, so it reads as a choice within the
     pane rather than a third destination. */
  .tabs.sub { margin-bottom: .8rem; }
  .tabs.sub button {
    background: transparent; color: var(--dim);
    border: 1px solid var(--line); padding: .5rem;
  }
  .tabs.sub button[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  main { padding: .9rem; max-width: 46rem; margin: 0 auto; }
  section[hidden] { display: none; }

  p.lede { color: var(--dim); margin: 0 0 .9rem; font-size: .82rem; }

  textarea {
    width: 100%; min-height: 40vh; padding: .7rem;
    border: 1px solid var(--line); border-radius: 3px;
    background: #fff; color: var(--ink);
    font: inherit; font-size: 13px; resize: vertical;
  }
  pre.prompt {
    white-space: pre-wrap; word-break: break-word;
    background: #fff; border: 1px solid var(--line); border-radius: 3px;
    padding: .8rem; font-size: 12.5px; line-height: 1.55;
    max-height: 60vh; overflow: auto; margin: 0;
  }

  .row { display: flex; gap: .5rem; flex-wrap: wrap; margin: .7rem 0; }
  button.act {
    flex: 1 1 auto; min-width: 8rem; padding: .75rem 1rem;
    border: 0; border-radius: 3px; background: var(--ink); color: var(--paper);
    font: inherit; font-size: .8rem; letter-spacing: .1em; cursor: pointer;
  }
  button.act.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.act.go { background: var(--ok); }
  button.act:disabled { opacity: .35; cursor: default; }

  .verdict { padding: .8rem; border-radius: 3px; margin: .9rem 0; font-size: .9rem; }
  .verdict.pass { background: #E4F0E7; border-left: 4px solid var(--ok); }
  .verdict.fail { background: #F6E4E0; border-left: 4px solid var(--err); }
  .verdict.soft { background: #F6EEDC; border-left: 4px solid var(--warn); }
  .verdict b { display: block; font-size: 1rem; margin-bottom: .2rem; }

  ul.issues { list-style: none; padding: 0; margin: 0 0 1rem; }
  ul.issues li {
    border-left: 3px solid var(--line); padding: .45rem 0 .45rem .7rem;
    margin-bottom: .5rem; font-size: .82rem;
  }
  ul.issues li.error { border-left-color: var(--err); }
  ul.issues li.warn { border-left-color: var(--warn); }
  .where { display: block; font-size: .7rem; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
  .fix { display: block; color: var(--dim); margin-top: .15rem; }

  h2 { font-size: .78rem; letter-spacing: .12em; margin: 1.4rem 0 .5rem; color: var(--dim); }
  .mix { font-size: .78rem; color: var(--dim); margin: .3rem 0 0; }
  .toast {
    position: fixed; left: 50%; bottom: 1.4rem; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: .6rem 1rem;
    border-radius: 3px; font-size: .8rem; opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .toast.on { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>MYFLASH <small>deck check</small></h1>
  <div class="tabs">
    <button id="tab-prompt" aria-selected="true">1 · THE PROMPT</button>
    <button id="tab-check" aria-selected="false">2 · CHECK</button>
  </div>
</header>

<main>

<section id="pane-prompt">
  <div class="tabs sub">
    <button id="m-knowledge" aria-selected="true">FROM KNOWLEDGE</button>
    <button id="m-article" aria-selected="false">FROM AN ARTICLE</button>
  </div>
  <p class="lede" id="prompt-lede"></p>
  <div class="row">
    <button class="act" id="copy-prompt">COPY THE PROMPT</button>
  </div>
  <pre class="prompt" id="prompt-text"></pre>
</section>

<section id="pane-check" hidden>
  <p class="lede">Paste what the AI gave you. Fences and stray sentences are fine —
    they get stripped.</p>
  <textarea id="input" placeholder="Paste the deck here"></textarea>
  <div class="row">
    <button class="act" id="run">CHECK IT</button>
    <button class="act ghost" id="clear">CLEAR</button>
  </div>
  <div id="out"></div>
</section>

</main>

<div class="toast" id="toast"></div>

<!-- The prompt lives here as inert text so there is exactly one copy of
     it: the page renders it and the clipboard button ships it. -->
<script type="text/plain" id="p-article">
You are writing a flashcard deck for a first-year medical resident. The cards
are for fast factual recall on a phone, a few seconds each, in a spare moment.

I will give you a reference article. Read it and return ONE JSON object.
No explanation before or after it, no markdown fence.

Cover the article's high-yield facts, not all of its facts. Aim for 15 to 30
cards. If the material is bigger than that, write the best 30.
</script>

<script type="text/plain" id="p-knowledge">
You are writing flashcards for a first-year medical resident. The cards are
for fast factual recall on a phone, a few seconds each, in a spare moment.

I will name a disease. Write its cards from your own knowledge and return ONE
JSON ARRAY of decks. No explanation before or after it, no markdown fence.

═══ SUB-DECKS ═══

Split the disease into these facets, each its own deck, all sharing one topic:

  PRESENTATION   how it turns up — symptoms, signs, the classic picture
  DIAGNOSIS      tests, criteria, thresholds
  MANAGEMENT     first steps, drugs, doses, sequence
  PITFALLS       what gets missed, what goes wrong, what is contraindicated

Skip a facet the disease does not really have. Hypertension presents by being
silent, so it has no honest PRESENTATION deck, and an invented one is worse
than none. Seven to twelve cards per deck.

Each facet leans naturally toward certain card types — MANAGEMENT toward
order and number, DIAGNOSIS toward bucket and multi, PRESENTATION toward
recall. Follow that where it fits and ignore it where it does not.

═══ DIFFICULTY ═══

Mix the levels inside every deck rather than sorting them. Roughly:

  a third   medical school basics worth having back — the definition, the
            first-line drug, the classic triad
  a third   what a resident is expected to know — thresholds, second-line
            choices, when to escalate
  a third   what separates a good senior — the trap, the exception, the
            mechanism behind a side effect, the study that changed practice

The last third is what makes the deck worth opening twice. Do not pad it with
trivia: it should be clinically useful, not obscure.

═══ ONLY WHAT YOU ARE SURE OF ═══

There is no source document here, so accuracy is entirely on you.

Write only settled, standard teaching. If you are not confident a fact is
what most textbooks say, leave it out. Twenty certain cards beat thirty with
two wrong ones, and a wrong card is worse than a missing one because it gets
memorised.

If an exact figure varies between sources, use "low" and "high" for the range
rather than inventing a precise "value". The format wants a single number and
that is exactly what pushes you into false precision.

Do not write cards on anything where guidance has recently changed or where
practice varies by institution. If a fact needs a guideline edition attached
to be true, it is not settled enough for a card.

Do not add citations. A citation on a fact everybody teaches adds nothing,
and a plausible-looking one you are not certain of is worse than none —
it manufactures confidence exactly where doubt was useful. Write the cards
you are sure of and leave the sourcing off.

Where a card names a trial because the trial IS the fact worth knowing,
put that in "why" as prose, not as a reference field.
</script>

<script type="text/plain" id="p-core">
═══ WHAT MAKES A GOOD CARD HERE ═══

One fact per card. If the answer needs an "and", it is two cards.

The card stands alone. No "as above", no "in this patient", no reference to
anything the reader cannot see. It has to make sense cold.

Short answers. The answer is displayed very large, so keep it under about 40
characters. "Isotonic saline", not "Isotonic saline at 15-20 mL/kg in the
first hour". If the detail matters, put it in "why".

Ask what a resident is actually asked on the ward: thresholds, first steps,
doses, classic associations, the thing that gets missed.

One defensible answer per card. "Complication of DKA treatment" has five
right answers and will feel unfair at 3am. Narrow the question, or make it a
multi card.

Never write "which of the following", "all of the above", or "none of the
above". The app shows the options; the question should just ask the thing.

═══ CHOOSING A CARD TYPE ═══

There are nine types. Most material supports three or four of them well.
Use only those.

This matters more than variety: a deck of thirty recall and mcq cards is a
good deck. Do not reach for a type because it exists, and do not bend a fact
to fit a shape. A forced card is worse than no card. If the material never
states a direction of change, it has no trend cards in it, and that is fine.

Each type below has a condition. If the material does not meet it, skip it.

  recall     The default. One fact, one short answer. When in doubt, this.

  mcq        Only when there is exactly one right answer AND you can write
             three wrong ones a resident would genuinely consider. If your
             wrong answers are obviously wrong, make it a recall card.

  multi      Only when the source gives a set: diagnostic criteria, the
             features of a syndrome, the members of a class. Needs at least
             two right options and at least one wrong one.

  truefalse  Only to correct a common misconception, something a resident is
             likely to believe and get wrong. Not for facts that are merely
             true.

             Keep these under a fifth of the deck. True/false is the easiest
             card to write and the obvious home for a trap, so it quietly
             takes over. It is also a coin flip: the same trap written as an
             mcq, with the tempting wrong answer among the distractors, pays
             a guess 1 in 4 instead of 1 in 2 and teaches the discrimination
             rather than just the verdict.

             Balance the answers roughly evenly between true and false.
             Writing them all as misconceptions makes every answer "false"
             and the whole type guessable — so state some of them the right
             way round, and let the reader confirm rather than correct.

  number     Only when the answer IS a quantity: a threshold, a dose, a
             normal range. Never for a number buried in a longer answer.

  trend      Only when the source states the direction of change of two or
             more related values under one named condition. Two is enough
             when the pair IS the pattern — TSH up with free T4 down is a
             complete thought and padding it to three would invent a row.
             One value alone is a coin flip, not a pattern.

  bucket     Only when the source contrasts two named categories and you have
             at least four features that tell them apart.

  order      Only when a sequence is itself the fact: a protocol, a pathway.
             Three to six steps.

  match      Only for three to five pairs where each left has exactly one
             correct right. Drug to class, antidote to poison.

═══ THE SHAPES ═══

{ "type": "recall",    "q": "...", "a": "..." }
{ "type": "mcq",       "q": "...", "a": "...", "distractors": ["...", "...", "..."] }
{ "type": "multi",     "q": "...", "answers": ["...", "..."], "distractors": ["...", "..."] }
{ "type": "truefalse", "q": "...", "a": true, "why": "..." }
{ "type": "number",    "q": "...", "value": 3.3, "unit": "mEq/L", "tolerance": 0 }
{ "type": "number",    "q": "...", "low": 0.3, "high": 0.5, "unit": "mg" }
{ "type": "trend",     "q": "...", "items": [{ "label": "...", "dir": "up" }] }
{ "type": "bucket",    "q": "...", "bins": ["A", "B"], "items": [{ "label": "...", "bin": "A" }] }
{ "type": "order",     "q": "...", "steps": ["first", "second", "third"] }
{ "type": "match",     "q": "...", "pairs": [{ "left": "...", "right": "..." }] }

Use exactly these field names. Not "answer", not "options", not
"explanation". Add no fields of your own.

═══ HOW MUCH FITS ═══

The card is a phone screen and the type is large, so these are hard limits
rather than style advice. Over them, text drops to a smaller layout or
wraps into a wall.

  question          under 90 characters
  answer ("a")      under 40
  mcq/multi option  under 32
  order step        under 32
  bucket item       under 32, bin names under 16
  trend row label   under 28
  match left/right  under 24

And how many:

  mcq         3 distractors
  multi       2 to 4 right, 1 to 3 wrong, 6 options in total at most
  trend       2 to 5 rows
  bucket      exactly 2 bins, 4 to 8 items
  order       3 to 6 steps
  match       3 to 5 pairs

Write in US spelling and US units — edema not oedema, anemia not anaemia,
mg/dL and mEq/L. Mixing conventions inside one deck reads as carelessness
even when every fact is right.

═══ THE EIGHT THINGS THAT GO WRONG ═══

1. "dir" is exactly "up", "down" or "same". Lowercase. Not "increased",
   not "Up", not an arrow.

2. Every bucket "bin" must be one of the strings in "bins", copied character
   for character. Use two bins; a third costs the card its best interaction.

3. "steps" are written in the CORRECT order. The app shuffles them for the
   player. No two steps may share the same text.

4. No two "right" values in a match card may be the same, and no two options
   in an mcq or multi card may be the same. Identical options cannot be told
   apart, so the card cannot be graded.

5. A distractor is never the answer, and never merely a less-good answer.
   If a distractor would also be correct in some circumstance, replace it.
   Keep them in the same category as the answer — all electrolytes, all drug
   classes — so the card tests knowledge rather than which option looks
   out of place.

6. truefalse "a" is a JSON boolean: true or false, no quotes.

7. number: "value" for a target, "low" plus "high" for a genuine range.
   Never both in one card. Write bare numbers, so 3.3 and not "3.3 mEq/L";
   the unit goes in "unit". Set "tolerance" to 0 unless a near miss should
   count as right. Do not set "step", "min" or "max" — the app works those
   out from the answer, and a wrong one makes the card unanswerable.

8. Only "multi" uses "answers". Every other type that has one right answer
   uses "a".

═══ CHECK YOUR OWN WORK BEFORE YOU ANSWER ═══

The tool that receives this can verify shape — field names, counts, valid
values. It cannot tell whether a card is TRUE. That part is only ever
checked by you, so do it deliberately rather than trusting the first pass.

Before returning, go back over the cards and confirm each of these. They
are listed separately because each one has actually gone wrong:

1. Read every truefalse card as a plain claim and say whether it is true,
   then check that matches the boolean you wrote. An answer inverted
   against its own explanation is the single commonest error in this
   format, and it survives every automatic check there is.

2. Count the truefalse answers. If nearly all are false, rewrite some of
   the claims the right way round.

3. Take every mcq distractor in turn and ask whether it could be correct
   under any reasonable reading. If it could, replace it.

4. Check each number is a bare number in the unit you named, and that the
   figure is the one you actually mean — not the neighbouring threshold
   from the same guideline.

5. Read the questions as a set and confirm no two ask the same thing in
   different words, across facets as well as within one.

6. Confirm every question has exactly one defensible answer.

═══ "why" ═══

On any card. Add it ONLY where the answer is counterintuitive or commonly
confused, and use it to explain the trap. Most cards should not have one; a
"why" on an obvious fact is noise the reader has to look past. On truefalse,
always include it.

Length is not something to ration. Under about 140 characters it sits under
the answer; longer than that it gets a screen of its own, which the reader
opens if they want it. So write one tight sentence when one will do, and
take the room when the explanation genuinely needs it — but do not pad a
thin point to fill space.
</script>

<script type="text/plain" id="t-article">
═══ THE DECK ═══

{
  "id":    "kebab-case-slug",
  "name":  "SHORT NAME IN CAPS",
  "topic": "...",
  "blurb": "One short line about what this covers",
  "cards": [ ... ]
}

"ref" is optional here — the article is the source. Add it where a specific
figure would be worth tracing back.

"topic" groups decks on the home screen and ranks them together, and the
grouping is an exact string match. Reuse one of these existing topics if the
material belongs to it, spelled identically:

  §TOPICS§

Only invent a new topic if none of those fit.
</script>

<script type="text/plain" id="t-knowledge">
═══ WHAT TO RETURN ═══

A JSON array of decks, one per facet, all sharing the disease as "topic":

[
  {
    "id":    "hypertension-diagnosis",
    "topic": "Hypertension",
    "name":  "DIAGNOSIS",
    "blurb": "One short line about what this facet covers",
    "cards": [ ... ]
  },
  { "id": "hypertension-management", "topic": "Hypertension", "name": "MANAGEMENT", ... }
]

"topic" is the disease and must be spelled identically in every deck — the
grouping is an exact string match, so one stray spelling splits the disease
into two that rank separately.

"id" must be unique across all of them: the disease, then the facet.

Do not repeat a fact between facets. You can see all four at once, which is
the one chance to catch it.

If the disease is one of these, spell the topic exactly as shown:

  §TOPICS§
</script>

<script>
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };

  /* ─────────── topics, injected live ─────────── */
  function knownTopics() {
    var seen = {}, out = [];
    window.Store.allDecks().forEach(function (d) {
      if (d.topic && !seen[d.topic]) { seen[d.topic] = 1; out.push(d.topic); }
    });
    return out;
  }

  var TOPICS = knownTopics();

  /* Two prompts sharing one middle. The rules about shapes and the eight
     things that go wrong are identical either way, and keeping two copies
     of them is how they drift apart. */
  function build(which) {
    var head = $(which === 'article' ? '#p-article' : '#p-knowledge').textContent.trim();
    var tail = $(which === 'article' ? '#t-article' : '#t-knowledge').textContent.trim();
    return (head + '\n\n' + $('#p-core').textContent.trim() + '\n\n' + tail)
      .replace('§TOPICS§', TOPICS.join('\n  '));
  }

  var mode = 'knowledge';
  var PROMPT = '';

  function setMode(m) {
    mode = m;
    PROMPT = build(m);
    $('#prompt-text').textContent = PROMPT;
    $('#m-knowledge').setAttribute('aria-selected', m === 'knowledge');
    $('#m-article').setAttribute('aria-selected', m === 'article');
    $('#prompt-lede').textContent = m === 'knowledge'
      ? 'Copy this, add "Write cards for: hypertension", and send it. You get every sub-deck for the disease in one reply.'
      : 'Copy this, paste your reference article underneath, and send both. You get one deck back.';
  }

  /* ─────────── chrome ─────────── */
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('on'); }, 1800);
  }

  /* navigator.clipboard is https-only and absent under file://, so keep
     the ancient path as a fallback rather than failing silently. */
  function copy(text, said) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); toast(said); }
      catch (e) { toast('Copy failed — select it by hand.'); }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(said); }, fallback);
    } else fallback();
  }

  function tab(which) {
    $('#tab-prompt').setAttribute('aria-selected', which === 'prompt');
    $('#tab-check').setAttribute('aria-selected', which === 'check');
    $('#pane-prompt').hidden = which !== 'prompt';
    $('#pane-check').hidden = which !== 'check';
    window.scrollTo(0, 0);
  }

  $('#tab-prompt').addEventListener('click', function () { tab('prompt'); });
  $('#tab-check').addEventListener('click', function () { tab('check'); });
  $('#copy-prompt').addEventListener('click', function () { copy(PROMPT, 'Prompt copied'); });
  $('#m-knowledge').addEventListener('click', function () { setMode('knowledge'); });
  $('#m-article').addEventListener('click', function () { setMode('article'); });
  setMode('knowledge');

  /* ─────────── the check ─────────── */
  var h = function (tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text != null) el.textContent = text;
    return el;
  };

  function issueList(items) {
    var ul = h('ul', 'issues');
    items.forEach(function (i) {
      var li = h('li', i.level);
      li.appendChild(h('span', 'where', i.where));
      li.appendChild(document.createTextNode(i.msg));
      if (i.fix) li.appendChild(h('span', 'fix', i.fix));
      ul.appendChild(li);
    });
    return ul;
  }

  function run() {
    var out = $('#out');
    out.textContent = '';

    var parsed = window.Validate.parse($('#input').value);
    if (parsed.error) {
      var v = h('div', 'verdict fail');
      v.appendChild(h('b', null, 'Could not read it'));
      v.appendChild(document.createTextNode(parsed.error));
      out.appendChild(v);
      return;
    }

    var decks = parsed.decks;
    var result = window.Validate.checkSet(decks, TOPICS);
    var errs = result.report.errors(), warns = result.report.warnings();

    var box = h('div', 'verdict ' + (errs.length ? 'fail' : warns.length ? 'soft' : 'pass'));
    box.appendChild(h('b', null,
      errs.length ? errs.length + ' problem' + (errs.length === 1 ? '' : 's') + ' to fix'
        : warns.length ? 'Usable, with ' + warns.length + ' thing' + (warns.length === 1 ? '' : 's') + ' worth a look'
        : 'Clean'));
    box.appendChild(document.createTextNode(
      errs.length ? 'These cards will render broken or cannot be graded.'
        : warns.length ? 'Nothing is broken. These would just read better fixed.'
        : 'Every card is well formed. This does not check whether they are TRUE — that is still on you.'));

    var mix = Object.keys(result.types).sort(function (a, b) { return result.types[b] - result.types[a]; })
      .map(function (t) { return result.types[t] + ' ' + t; }).join(' · ');
    box.appendChild(h('p', 'mix',
      (decks.length > 1 ? decks.length + ' decks, ' : '') + result.count + ' cards — ' + mix));
    if (decks.length > 1) {
      box.appendChild(h('p', 'mix', decks.map(function (d) {
        return (d.name || '?') + ' ' + (d.cards ? d.cards.length : 0);
      }).join('  ·  ')));
    }
    out.appendChild(box);

    if (errs.length) { out.appendChild(h('h2', null, 'MUST FIX')); out.appendChild(issueList(errs)); }
    if (warns.length) { out.appendChild(h('h2', null, 'WORTH FIXING')); out.appendChild(issueList(warns)); }

    var row = h('div', 'row');

    if (errs.length || warns.length) {
      var ask = h('button', 'act', 'COPY A FIX REQUEST');
      ask.addEventListener('click', function () {
        copy(window.Validate.fixRequest(result), 'Paste that back to the AI');
      });
      row.appendChild(ask);
    }

    if (!errs.length) {
      var add = h('button', 'act go', decks.length > 1 ? 'ADD ALL ' + decks.length + ' TO MYFLASH' : 'ADD TO MYFLASH');
      add.addEventListener('click', function () { install(decks); });
      row.appendChild(add);
    }

    out.appendChild(row);
  }

  function install(decks) {
    var existing = window.Store.allDecks();
    var clashes = [];

    decks.forEach(function (deck) {
      if (!deck.id) {
        deck.id = 'user-' + String(deck.name || 'deck').toLowerCase()
          .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      }
      if (!deck.blurb) deck.blurb = deck.cards.length + ' cards';
      delete deck._wrapped;
      if (existing.some(function (d) { return d.id === deck.id; })) clashes.push(deck.id);
    });

    /* Ask once for the whole set. Four confirms for four sub-decks is how
       someone ends up with half a disease installed. */
    if (clashes.length && !confirm(
        clashes.length + ' deck' + (clashes.length === 1 ? '' : 's') +
        ' already exist:\n\n' + clashes.join('\n') +
        '\n\nReplace? Progress on those cards is kept.')) return;

    try {
      decks.forEach(function (d) { window.Store.saveDeck(d); });
    } catch (e) {
      toast('Could not save: ' + e.message);
      return;
    }

    var after = window.Store.allDecks();
    var landed = decks.filter(function (deck) {
      var back = after.filter(function (d) { return d.id === deck.id; })[0];
      return back && back.cards.length === deck.cards.length;
    }).length;

    if (landed !== decks.length) {
      toast('Only ' + landed + ' of ' + decks.length + ' saved — same origin as the app?');
      return;
    }
    toast('Added. Open MYFLASH under ' + (decks[0].topic || 'Other') + '.');
  }

  $('#run').addEventListener('click', run);
  $('#clear').addEventListener('click', function () {
    $('#input').value = '';
    $('#out').textContent = '';
    $('#input').focus();
  });
})();
</script>
</body>
</html>
