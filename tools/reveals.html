<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Reveal Preview</title>
<!-- A throwaway preview for choosing the recall reveal. Nothing in the app
     reads this page. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css?v=32">
<style>
  .pv {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: max(.9rem, env(safe-area-inset-top)) 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── Controls ─────────────────────────────────────────── */
  .pv-tabs { display: flex; gap: .4rem; }
  .pv-tab {
    flex: 1;
    padding: .55rem .3rem;
    border-radius: 12px;
    border: 2px solid var(--line);
    border-bottom-width: 4px;
    font-size: .8rem;
    font-weight: 800;
    line-height: 1.15;
    color: var(--muted);
  }
  .pv-tab.is-on { background: var(--sel-bg); border-color: var(--sel); color: #1899D6; }
  .pv-keep {
    display: flex;
    align-items: center;
    gap: .6rem;
    margin-top: .55rem;
    font-size: .9rem;
    color: var(--muted);
  }
  .pv-keep.is-off { opacity: .4; pointer-events: none; }
  .pv-keep .toggle-track { width: 42px; height: 24px; }
  .pv-keep .toggle-thumb { width: 14px; height: 14px; }
  .pv-keep.is-on .toggle-track { background: var(--ok); border-color: var(--ok); }
  .pv-keep.is-on .toggle-thumb { transform: translateX(18px); }

  /* ── The card ─────────────────────────────────────────── */
  .pv-card { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-top: 1.25rem; }
  .pv-kicker {
    font-size: .85rem;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    transition: opacity .13s ease;
  }
  .pv-kicker.is-changing { opacity: 0; }

  /* Everything inside is placed absolutely and measured in JS, so the
     question can travel from the middle to the top without the layout
     jumping underneath it. */
  .pv-region { position: relative; flex: 1; min-height: 0; margin-top: .75rem; }
  .pv-q, .pv-a, .pv-why { position: absolute; left: 0; right: 0; top: 0; margin: 0; }

  .pv-q {
    font-size: 30px;
    font-weight: 800;
    line-height: 1.25;
    color: var(--ink);
    text-wrap: pretty;
  }
  .pv-a {
    font-size: 32px;
    font-weight: 900;
    line-height: 1.2;
    color: var(--acc);
    opacity: 0;
    text-wrap: pretty;
  }
  .pv-why {
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.45;
    color: var(--ink);
    opacity: 0;
    transition: opacity .25s ease;
  }
  .pv-why.is-in { opacity: 1; }
  .pv-cue {
    display: inline-flex;
    gap: .4rem;
    font-size: .85rem;
    font-weight: 800;
    letter-spacing: .06em;
    color: var(--sel);
    padding: .5rem .9rem;
    border: 2px solid var(--line);
    border-bottom-width: 4px;
    border-radius: 14px;
  }

  .pv-bar { display: flex; justify-content: space-between; align-items: center; gap: .9rem; min-height: 56px; }
  .pv-bar .swipe-side {
    font-weight: 800;
    font-size: .95rem;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: .8rem 1.3rem;
    border-radius: 16px;
    border: 2px solid var(--line);
    border-bottom-width: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .pv-bar.is-in .swipe-side { opacity: 1; pointer-events: auto; }
  .pv-tap {
    flex: 1;
    text-align: center;
    font-size: .85rem;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Motion ───────────────────────────────────────────────
     The question's move to the top is shared: option 1 always does it,
     and the switch adds it to the others. */
  .pv-q.is-moving {
    transition: transform .42s cubic-bezier(.22, 1, .36, 1),
                font-size .42s cubic-bezier(.22, 1, .36, 1),
                color .42s ease;
  }
  .pv-q.is-small { font-size: 24px; color: var(--muted); }

  /* Replacing the question: the current fade. */
  .pv-q.is-leaving {
    transition: transform .2s cubic-bezier(.25, .8, .4, 1), opacity .2s cubic-bezier(.25, .8, .4, 1);
    opacity: 0;
  }

  /* Now: fade in with a short rise. */
  .pv-a.m-fade { transition: transform .2s cubic-bezier(.25, .8, .4, 1), opacity .2s cubic-bezier(.25, .8, .4, 1); }

  /* 1: rises into the space the question left, a beat behind it. */
  .pv-a.m-slide {
    transition: transform .42s cubic-bezier(.22, 1, .36, 1) .1s, opacity .3s ease .1s;
  }

  /* 2: word by word. The block is visible; each word arrives on its own. */
  .pv-a.m-words { opacity: 1; }
  .pv-a .w {
    display: inline-block;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .2s ease, transform .2s cubic-bezier(.22, 1, .36, 1);
    transition-delay: var(--d, 0ms);
  }
  .pv-a.is-in .w { opacity: 1; transform: none; }

  /* 3: highlighter. The text fades in, then a marker stroke sweeps
     behind it. `clone` keeps the stroke on every line of a wrapped answer. */
  .pv-a.m-mark { transition: opacity .15s ease; }
  .pv-a .mark {
    background-image: linear-gradient(#D7FFB8, #D7FFB8);
    background-repeat: no-repeat;
    background-position: 0 85%;
    background-size: 0% 70%;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    padding: 0 .12em;
    margin: 0 -.12em;
    border-radius: 4px;
    transition: background-size .45s cubic-bezier(.5, 0, .2, 1) .15s;
  }
  .pv-a.m-mark.is-in .mark { background-size: 100% 70%; }

  .pv-a.is-in { opacity: 1; }

  /* The whole card turns over between questions. */
  .pv-region.is-out { opacity: 0; transition: opacity .15s ease; }
</style>
</head>
<body>
<div class="pv">
  <div class="pv-tabs" id="tabs">
    <button class="pv-tab" data-mode="slide">1<br>Shrink &amp; slide</button>
    <button class="pv-tab" data-mode="words">2<br>Word by word</button>
    <button class="pv-tab" data-mode="mark">3<br>Highlighter</button>
    <button class="pv-tab" data-mode="fade">Now<br>Fade</button>
  </div>
  <button class="pv-keep" id="keep" role="switch" aria-checked="false">
    <span class="toggle-track"><span class="toggle-thumb"></span></span>
    <span id="keep-label">Keep the question on screen</span>
  </button>
  <button class="pv-keep" id="whypos" role="switch" aria-checked="false">
    <span class="toggle-track"><span class="toggle-thumb"></span></span>
    <span>Explanation at the bottom</span>
  </button>

  <div class="pv-card" id="card">
    <div class="pv-kicker" id="kicker">Tap to reveal</div>
    <div class="pv-region" id="region">
      <h2 class="pv-q" id="q"></h2>
      <div class="pv-a" id="a"></div>
      <div class="pv-why" id="why"></div>
    </div>
    <div class="pv-bar" id="bar">
      <button class="swipe-side" data-next>Missed</button>
      <span class="pv-tap" id="tap">Tap anywhere</span>
      <button class="swipe-side" data-next>Got it</button>
    </div>
  </div>
</div>

<script src="../js/decks.js?v=32"></script>
<script>
(function () {
  'use strict';

  /* Real recall cards, picked to stress the layout: the longest questions,
     the longest answers, short explanations that show inline, long ones
     that only show the WHY button, and some with none. */
  var recall = [];
  Decks.BUILTIN.forEach(function (d) {
    d.cards.forEach(function (c) { if ((c.type || 'recall') === 'recall') recall.push(c); });
  });
  function by(fn) { return recall.slice().sort(function (x, y) { return fn(y) - fn(x); }); }
  var picked = [];
  function add(list, n) {
    list.forEach(function (c) { if (n > 0 && picked.indexOf(c) < 0) { picked.push(c); n--; } });
  }
  add(recall.filter(function (c) { return c.why && c.why.length <= 140; }), 4);
  add(by(function (c) { return c.q.length; }), 3);
  add(by(function (c) { return String(c.a).length; }), 3);
  add(recall.filter(function (c) { return !c.why; }), 2);
  /* Interleave so the long ones are not all at the end. */
  var CARDS = [];
  for (var i = 0; i < 4; i++) [0, 4, 7, 10].forEach(function (o) { if (picked[o + i] && CARDS.indexOf(picked[o + i]) < 0) CARDS.push(picked[o + i]); });
  picked.forEach(function (c) { if (CARDS.indexOf(c) < 0) CARDS.push(c); });

  var $ = function (s) { return document.querySelector(s); };
  var region = $('#region'), qEl = $('#q'), aEl = $('#a'), whyEl = $('#why');
  var kicker = $('#kicker'), bar = $('#bar'), tap = $('#tap');

  var mode = 'slide', keep = false, whyAtBottom = false, index = 0, revealed = false, busy = false;
  /* The question's size once it has moved aside, against 30px before. */
  var Q_SMALL = 24;

  function setKicker(text) {
    kicker.classList.add('is-changing');
    setTimeout(function () { kicker.textContent = text; kicker.classList.remove('is-changing'); }, 130);
  }

  /* Height of an element's text at a given font size, at the region's
     width, without disturbing the real one. */
  function heightAt(el, size) {
    var c = el.cloneNode(true);
    c.className = el.className.replace(/\bis-\S+/g, '');
    c.style.cssText = 'position:absolute;visibility:hidden;left:0;right:0;top:0;transition:none;font-size:' + size + 'px';
    region.appendChild(c);
    var hgt = c.getBoundingClientRect().height;
    c.remove();
    return hgt;
  }

  function keeping() { return mode === 'slide' || keep; }

  function render() {
    var card = CARDS[index % CARDS.length];
    revealed = false;

    qEl.className = 'pv-q';
    qEl.style.transform = '';
    qEl.style.opacity = '';
    qEl.textContent = card.q;

    aEl.className = 'pv-a';
    aEl.style.transform = '';
    aEl.textContent = '';
    var text = String(card.a);
    if (mode === 'words') {
      text.split(/\s+/).forEach(function (w, i, all) {
        var s = document.createElement('span');
        s.className = 'w';
        s.textContent = w;
        /* The whole answer lands within about a quarter second. */
        s.style.setProperty('--d', Math.round(i * Math.min(70, 260 / all.length)) + 'ms');
        aEl.appendChild(s);
        if (i < all.length - 1) aEl.appendChild(document.createTextNode(' '));
      });
    } else if (mode === 'mark') {
      var m = document.createElement('span');
      m.className = 'mark';
      m.textContent = text;
      aEl.appendChild(m);
    } else {
      aEl.textContent = text;
    }

    whyEl.className = 'pv-why';
    whyEl.textContent = '';
    if (card.why && card.why.length <= 140) whyEl.textContent = card.why;
    else if (card.why) {
      var cue = document.createElement('span');
      cue.className = 'pv-cue';
      cue.textContent = '↑ WHY';
      whyEl.appendChild(cue);
    }

    bar.classList.remove('is-in');
    tap.textContent = 'Tap anywhere';
    kicker.textContent = 'Tap to reveal';

    /* The question is laid out at the top and pushed down to the middle,
       so the move to the top is a single transform. */
    var big = qEl.getBoundingClientRect().height;
    qEl.dataset.mid = Math.max(0, (region.clientHeight - big) / 2);
    qEl.style.transform = 'translateY(' + qEl.dataset.mid + 'px)';
  }

  function reveal() {
    revealed = true;
    setKicker('Knew it?');
    var regionH = region.clientHeight;
    var aH = heightAt(aEl, 32);
    var whyH = whyEl.textContent || whyEl.firstChild ? heightAt(whyEl, 16) : 0;
    var GAP = 18;
    var smallH = keeping() ? heightAt(qEl, Q_SMALL) : 0;

    /* The answer sits in the middle of the screen. The question sits just
       above it, so it only travels as far as it has to. */
    var aTop = (regionH - aH) / 2;
    var qTop = aTop - GAP - smallH;
    var whyTop = whyAtBottom ? regionH - whyH - GAP : aTop + aH + GAP;

    /* Long text can push past the edges; slide the block back in. */
    var lowest = whyH ? Math.max(whyTop + whyH, aTop + aH) : aTop + aH;
    if (!whyAtBottom && lowest > regionH) { var up = lowest - regionH; aTop -= up; qTop -= up; whyTop -= up; }
    var highest = keeping() ? qTop : aTop;
    if (highest < 0) { aTop -= highest; qTop -= highest; if (!whyAtBottom) whyTop -= highest; }
    if (whyAtBottom && whyTop < aTop + aH + GAP) whyTop = aTop + aH + GAP;

    if (keeping()) {
      qEl.classList.add('is-moving', 'is-small');
      qEl.style.transform = 'translateY(' + qTop + 'px)';
    } else {
      qEl.classList.add('is-leaving');
      qEl.style.transform = 'translateY(' + (Number(qEl.dataset.mid) - regionH * 0.18) + 'px)';
    }

    var cls = { slide: 'm-slide', words: 'm-words', mark: 'm-mark', fade: 'm-fade' }[mode];
    /* Where each answer starts from before it settles. */
    var from = mode === 'slide' ? 28 : mode === 'fade' ? (keeping() ? 24 : regionH * 0.18) : 0;
    aEl.style.transition = 'none';
    aEl.style.transform = 'translateY(' + (aTop + from) + 'px)';
    aEl.getBoundingClientRect();
    aEl.style.transition = '';
    aEl.classList.add(cls);
    whyEl.style.transform = 'translateY(' + whyTop + 'px)';

    requestAnimationFrame(function () {
      aEl.style.transform = 'translateY(' + aTop + 'px)';
      aEl.classList.add('is-in');
    });
    setTimeout(function () {
      whyEl.classList.add('is-in');
      bar.classList.add('is-in');
      tap.textContent = 'swipe';
    }, mode === 'slide' ? 380 : 260);
  }

  function next() {
    if (busy) return;
    busy = true;
    region.classList.add('is-out');
    setTimeout(function () {
      index++;
      render();
      region.classList.remove('is-out');
      busy = false;
    }, 160);
  }

  $('#card').addEventListener('click', function (e) {
    if (e.target.closest('[data-next]')) { next(); return; }
    if (!revealed) reveal(); else next();
  });

  function paintControls() {
    [].forEach.call(document.querySelectorAll('.pv-tab'), function (t) {
      t.classList.toggle('is-on', t.dataset.mode === mode);
    });
    var sw = $('#keep');
    sw.classList.toggle('is-on', keeping());
    sw.classList.toggle('is-off', mode === 'slide');
    sw.setAttribute('aria-checked', keeping() ? 'true' : 'false');
    var wp = $('#whypos');
    wp.classList.toggle('is-on', whyAtBottom);
    wp.setAttribute('aria-checked', whyAtBottom ? 'true' : 'false');
    $('#keep-label').textContent = mode === 'slide'
      ? 'Option 1 always keeps the question'
      : 'Keep the question on screen';
  }

  $('#tabs').addEventListener('click', function (e) {
    var t = e.target.closest('.pv-tab');
    if (!t) return;
    mode = t.dataset.mode;
    paintControls();
    render();
  });
  $('#whypos').addEventListener('click', function () {
    whyAtBottom = !whyAtBottom;
    paintControls();
    render();
  });
  $('#keep').addEventListener('click', function () {
    keep = !keep;
    paintControls();
    render();
  });

  paintControls();
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!revealed) render(); });
})();
</script>
</body>
</html>
