<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Reveal Preview</title>
<!-- A throwaway preview for the recall reveal. Nothing in the app reads
     this page. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css?v=135">
<style>
  .pv {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: max(.9rem, env(safe-area-inset-top)) 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
  }

  /* Which rules this card hit, so they can be judged. */
  .pv-rules {
    min-height: 2.6em;
    font-size: .8rem;
    font-weight: 700;
    line-height: 1.3;
    color: #AFAFAF;
  }

  .pv-card { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-top: .75rem; }
  .pv-kicker {
    font-size: .85rem;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    transition: opacity .13s ease;
  }
  .pv-kicker.is-changing { opacity: 0; }

  /* Everything inside is placed absolutely and measured in JS, so the
     question can travel without the layout jumping underneath it. */
  .pv-region { position: relative; flex: 1; min-height: 0; margin-top: .75rem; }
  .pv-q, .pv-a, .pv-why { position: absolute; left: 0; right: 0; top: 0; margin: 0; }

  .pv-q {
    font-weight: 800;
    line-height: 1.25;
    color: var(--ink);
    text-wrap: pretty;
  }
  .pv-q.is-moving { transition: transform .42s cubic-bezier(.22, 1, .36, 1); }

  .pv-a {
    font-weight: 900;
    line-height: 1.2;
    color: var(--acc);
    opacity: 0;
    text-wrap: pretty;
  }
  .pv-a.is-moving {
    transition: transform .36s cubic-bezier(.22, 1, .36, 1) .12s, opacity .3s ease .12s;
  }
  .pv-a.is-in { opacity: 1; }

  .pv-why {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.45;
    color: var(--muted);
    opacity: 0;
    transition: opacity .7s ease .45s;
  }
  .pv-why.is-in { opacity: 1; }
  .pv-cue {
    display: inline-flex;
    font-size: .85rem;
    font-weight: 800;
    letter-spacing: .06em;
    color: var(--sel);
    padding: .5rem .9rem;
    border: 2px solid var(--line);
    border-bottom-width: 4px;
    border-radius: 14px;
  }

  .pv-bar { display: flex; justify-content: space-between; align-items: center; gap: .9rem; min-height: 56px; }
  .pv-bar .swipe-side {
    font-weight: 800;
    font-size: .95rem;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: .8rem 1.3rem;
    border-radius: 16px;
    border: 2px solid var(--line);
    border-bottom-width: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .pv-bar.is-in .swipe-side { opacity: 1; pointer-events: auto; }
  .pv-tap {
    flex: 1;
    text-align: center;
    font-size: .85rem;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .pv-region.is-out { opacity: 0; transition: opacity .15s ease; }
</style>
</head>
<body>
<div class="pv">
  <div class="pv-rules" id="rules"></div>
  <div class="pv-card" id="card">
    <div class="pv-kicker" id="kicker">Tap to reveal</div>
    <div class="pv-region" id="region">
      <h2 class="pv-q" id="q"></h2>
      <div class="pv-a" id="a"></div>
      <div class="pv-why" id="why"></div>
    </div>
    <div class="pv-bar" id="bar">
      <button class="swipe-side" data-next>Missed</button>
      <span class="pv-tap" id="tap">Tap anywhere</span>
      <button class="swipe-side" data-next>Got it</button>
    </div>
  </div>
</div>

<script src="../js/decks.js?v=135"></script>
<script>
(function () {
  'use strict';

  /* ── The rules ───────────────────────────────────────────── */
  /* Sizes are picked once from the length of the text and never change
     while the card is on screen, so nothing rewraps mid-motion. */
  function questionSize(text) { return text.length <= 50 ? 30 : text.length <= 80 ? 26 : 22; }
  function answerSize(text)   { return text.length <= 24 ? 34 : 28; }
  /* Up to this many characters the explanation shows by itself after the
     answer. Longer ones get the WHY button and the swipe-up screen. */
  var WHY_INLINE = 220;
  /* Where the question and answer sit, as a share of the space: well
     above the middle. The question is placed there from the start and
     never moves; the answer rises in underneath it. The explanation sits apart from them, near
     the bottom, so it reads as an aside rather than part of the answer. */
  var SETTLE = 0.32;
  var GAP = 16;

  /* Every recall card, the hardest layouts first. */
  var recall = [];
  Decks.BUILTIN.forEach(function (d) {
    d.cards.forEach(function (c) { if ((c.type || 'recall') === 'recall') recall.push(c); });
  });
  function weight(c) { return c.q.length + String(c.a).length * 2 + (c.why && c.why.length <= WHY_INLINE ? c.why.length : 0); }
  var hard = recall.slice().sort(function (x, y) { return weight(y) - weight(x); }).slice(0, 6);
  var CARDS = hard.concat(recall.filter(function (c) { return hard.indexOf(c) < 0; }));

  var $ = function (s) { return document.querySelector(s); };
  var region = $('#region'), qEl = $('#q'), aEl = $('#a'), whyEl = $('#why');
  var kicker = $('#kicker'), bar = $('#bar'), tap = $('#tap'), rules = $('#rules');
  var index = 0, revealed = false, busy = false, plan = null;

  function setKicker(text) {
    kicker.classList.add('is-changing');
    setTimeout(function () { kicker.textContent = text; kicker.classList.remove('is-changing'); }, 130);
  }

  function place(el, y) { el.style.transform = 'translateY(' + Math.round(y) + 'px)'; }

  function render() {
    var card = CARDS[index % CARDS.length];
    var q = card.q, a = String(card.a), why = card.why || '';
    revealed = false;

    qEl.className = 'pv-q';
    qEl.style.fontSize = questionSize(q) + 'px';
    qEl.textContent = q;

    aEl.className = 'pv-a';
    aEl.style.fontSize = answerSize(a) + 'px';
    aEl.textContent = a;

    whyEl.className = 'pv-why';
    whyEl.textContent = '';
    var inline = why && why.length <= WHY_INLINE;
    if (inline) whyEl.textContent = why;

    /* Measure, then work out both resting places. */
    var R = region.clientHeight;
    var qH = qEl.getBoundingClientRect().height;
    var aH = aEl.getBoundingClientRect().height;
    var whyH = inline ? whyEl.getBoundingClientRect().height : 0;

    var block = qH + GAP + aH;
    var top = Math.max(0, R * SETTLE - block / 2);
    /* If the explanation would run into the answer, lift the block. If it
       still does not fit, fall back to the WHY button. */
    if (inline && top + block + 2 * GAP + whyH > R) top = Math.max(0, R - (block + 2 * GAP + whyH));
    if (inline && top + block + 2 * GAP + whyH > R) { inline = false; whyEl.textContent = ''; }
    if (why && !inline) {
      var cue = document.createElement('span');
      cue.className = 'pv-cue';
      cue.textContent = '↑ WHY';
      whyEl.appendChild(cue);
      whyH = whyEl.getBoundingClientRect().height;
    }

    plan = { qStart: top, qEnd: top, aEnd: top + qH + GAP,
             whyTop: (function () {
               /* Near the bottom, lifted part of the way toward the answer
                  when there is room. */
               var lowest = top + block + 2 * GAP, bottom = R - whyH - GAP;
               return bottom > lowest ? bottom - (bottom - lowest) * 0.4 : lowest;
             })() };
    place(qEl, plan.qStart);
    place(aEl, plan.aEnd + 24);
    place(whyEl, plan.whyTop);

    rules.textContent =
      'Question ' + q.length + ' chars → ' + questionSize(q) + 'px · answer ' + a.length + ' → ' + answerSize(a) + 'px · ' +
      (!why ? 'no explanation' : 'explanation ' + why.length + ' chars → ' + (inline ? 'shown' : 'WHY button'));

    bar.classList.remove('is-in');
    tap.textContent = 'Tap anywhere';
    kicker.textContent = 'Tap to reveal';
  }

  function reveal() {
    revealed = true;
    setKicker('Knew it?');
    aEl.classList.add('is-moving');
    requestAnimationFrame(function () {
      place(qEl, plan.qEnd);
      place(aEl, plan.aEnd);
      aEl.classList.add('is-in');
      whyEl.classList.add('is-in');
    });
    setTimeout(function () {
      bar.classList.add('is-in');
      tap.textContent = 'swipe';
    }, 380);
  }

  function next() {
    if (busy) return;
    busy = true;
    region.classList.add('is-out');
    setTimeout(function () {
      index++;
      render();
      region.classList.remove('is-out');
      busy = false;
    }, 160);
  }

  $('#card').addEventListener('click', function (e) {
    if (e.target.closest('[data-next]')) { next(); return; }
    if (!revealed) reveal(); else next();
  });

  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (!revealed) render(); });
})();
</script>
</body>
</html>
